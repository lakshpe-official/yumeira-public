<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>YUMEIRA</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-main">YUMEIRA</div>
      <div class="brand-jp">ユメイラ</div>
    </div>

    <nav class="topnav">
      <a href="#home">HOME</a>
      <a href="#featured">ANIME & DRAMA</a>
      <a href="#gallery">GALLERY</a>
      <a href="#about">ABOUT</a>
    </nav>

    <a class="download-btn top-download" href="#" id="top-download">
アプリを入手 · 앱 받기
    </a>
  </header>


  <main>

    <section class="hero" id="home">

      <div class="hero-slider">

        <div class="hero-slide active">
          <img
            src="assets/hero/hero-01.jpg"
            alt="YUMEIRA Visual 01"
          />
        </div>

        <div class="hero-slide">
          <img
            src="assets/hero/hero-02.jpg"
            alt="YUMEIRA Visual 02"
          />
        </div>

        <div class="hero-slide">
          <img
            src="assets/hero/hero-03.jpg"
            alt="YUMEIRA Visual 03"
          />
        </div>

        <div class="hero-slide">
          <img
            src="assets/hero/hero-04.jpg"
            alt="YUMEIRA Visual 04"
          />
        </div>

      </div>


      <button
        class="hero-arrow hero-prev"
        id="hero-prev"
        aria-label="Previous slide"
      >
        ‹
      </button>

      <button
        class="hero-arrow hero-next"
        id="hero-next"
        aria-label="Next slide"
      >
        ›
      </button>


      <div class="hero-overlay">

        <div class="hero-copy">

          <h1>YUMEIRA</h1>

          <div class="hero-jp">
            ユメイラ
          </div>

          <div class="hero-tagline">
アニメ · ストーリー · アジア
          </div>

          <div class="hero-subline">
실사 × AI × 애니메이션
          </div>

          <a
            class="download-btn hero-download"
            href="#"
            id="hero-download"
          >
アプリを入手 · 앱 받기
          </a>

        </div>

      </div>


      <div class="hero-dots" id="hero-dots">
        <button class="hero-dot active" data-slide="0"></button>
        <button class="hero-dot" data-slide="1"></button>
        <button class="hero-dot" data-slide="2"></button>
        <button class="hero-dot" data-slide="3"></button>
      </div>

    </section>
    <section class="social-section">

  <div class="social-panel">

    <a
      class="social-card facebook-card"
      href="#"
      id="facebook-link"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-left">
        <div class="social-icon">f</div>

        <div>
<div class="social-small">フォローする</div>
<div class="social-title">フェイスブック</div>
        </div>
      </div>

      <div class="social-arrow">→</div>
    </a>


    <a
      class="social-card instagram-card"
      href="#"
      id="instagram-link"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-left">
        <div class="social-icon instagram-icon">◎</div>

        <div>
<div class="social-small">フォローする</div>
<div class="social-title">インスタグラム</div>
        </div>
      </div>

      <div class="social-arrow">→</div>
    </a>

  </div>

</section>

  </main>
<section class="featured-section" id="featured">

  <div class="featured-header">
    <div>
      <div class="featured-kicker">ユメイラ厳選</div>
      <h2>注目のビジュアル</h2>
    </div>

<button type="button" class="featured-more" id="featured-toggle">
  すべて見る →
</button>
  </div>

  <div class="featured-grid">

    <article class="featured-card">
<img
    class="featured-image"
    src="assets/featured/featured-01.jpg"
    alt="YUMEIRA Anime Visual"
/>
    </article>


    <article class="featured-card">
<img
    class="featured-image"
    src="assets/featured/featured-02.jpg"
    alt="YUMEIRA Anime"
/>
    </article>


    <article class="featured-card">
<img
    class="featured-image"
    src="assets/featured/featured-03.jpg"
    alt="YUMEIRA Real Drama"
/>
    </article>


    <article class="featured-card">
<img
    class="featured-image"
    src="assets/featured/featured-04.jpg"
    alt="YUMEIRA AI Visual"
/>
    </article>

  </div>

</section>

<section class="yumeira-footer-cta">
  <div class="yumeira-footer-inner">

    <div class="yumeira-footer-brand">YUMEIRA</div>
    <div class="yumeira-footer-jp">ユメイラ</div>

<p class="yumeira-footer-text">
  アニメとリアルが交わる、新しい物語の世界へ。
</p>

<p class="yumeira-footer-text yumeira-footer-ko">
  애니메이션과 현실이 만나는 새로운 이야기의 세계로.
</p>
    <a href="#" class="download-btn footer-download">
      アプリを入手 · 앱 받기
    </a>

    <div class="yumeira-footer-copy">
      © 2026 YUMEIRA
    </div>

  </div>
</section>

<script src="main.js"></script>

</body>
</html>
